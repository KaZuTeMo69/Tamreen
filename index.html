<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>تمرين</title>
<meta name="theme-color" content="#F2EEE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تمرين">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232A211B'/%3E%3Cg fill='%23F2EEE7'%3E%3Crect x='30' y='78' width='120' height='24' rx='12'/%3E%3Crect x='18' y='62' width='24' height='56' rx='10'/%3E%3Crect x='138' y='62' width='24' height='56' rx='10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EEE7;--card:#FCFAF6;--ink:#2A211B;--muted:#8C8378;--line:#E7E1D7;
  --sage:#D8E6C7;--sage-ink:#4A6138;--clay:#F6E5D8;--clay-ink:#8A4A20;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal','DM Sans',system-ui,sans-serif;
  font-size:16px;line-height:1.5;padding:max(14px,env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
.num{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums}
h1{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:12px 0 0}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--sage);color:var(--sage-ink);
  display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.label{font-size:19px;font-weight:700;margin:26px 0 10px}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.row+.row{border-top:1px solid var(--line)}
.tap{cursor:pointer;transition:background .12s,transform .08s}
.tap:active{background:var(--bg);transform:scale(.995)}
.muted{color:var(--muted)}.small{font-size:13px}
/* ── press feedback on everything ── */
button,a.chip,select{transition:transform .08s ease,filter .12s ease,background .12s ease}
button:active,a.chip:active{transform:scale(.96);filter:brightness(.93)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:18px;font-family:inherit;
  font-size:17px;font-weight:700;background:var(--ink);color:#FCFAF6;cursor:pointer}
.btn.light{background:var(--card);color:var(--ink)}
.btn.sage{background:var(--sage);color:var(--sage-ink)}
.btn.danger{background:var(--clay);color:var(--clay-ink)}
.btn:disabled{opacity:.35}
.chip{display:inline-block;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;
  background:var(--bg);color:var(--muted);border:0;font-family:inherit;cursor:pointer;text-decoration:none}
.chip.on{background:var(--sage);color:var(--sage-ink)}
.chip.ink{background:var(--ink);color:#FCFAF6}
.chip.tag{background:transparent;color:var(--muted);border:1px solid var(--line);cursor:default}
.chip.tag:active{transform:none;filter:none}
.pills{display:flex;gap:5px;margin-top:12px}
.pill{flex:1;height:10px;border-radius:999px;background:var(--line);transition:background .3s,height .3s}
.pill.on{background:var(--ink);height:16px}
.ex{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ex h3{margin:0;font-size:17px;font-weight:700}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
select{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);
  background:#fff;border-radius:999px;padding:6px 10px;color:var(--ink)}
select.big{font-size:15px;padding:12px 16px;width:100%;border-radius:16px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:7px}
.set .i{width:20px;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;flex:none}
input{font-family:'DM Sans',sans-serif;font-size:17px;text-align:center;width:100%;min-width:0;
  padding:12px 4px;border:1px solid var(--line);background:#fff;border-radius:14px;color:var(--ink)}
input:focus{outline:2px solid var(--sage);outline-offset:-2px}
.hint{font-size:11px;color:var(--muted);text-align:center;font-family:'DM Sans',sans-serif}
.hints{display:flex;gap:7px;margin-bottom:-2px}
.hints .i{width:20px;flex:none}
.prev{min-width:58px;text-align:left;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;flex:none}
.note{margin-top:12px;background:var(--clay);color:var(--clay-ink);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500}
.divider{display:flex;align-items:center;gap:10px;margin:22px 2px}
.divider hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.divider b{font-size:13px;color:var(--sage-ink);background:var(--sage);padding:6px 12px;border-radius:999px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--ink);border-radius:8px 8px 4px 4px;min-height:4px;position:relative}
.bars div.best{background:var(--sage-ink)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(430px,calc(100% - 36px));background:var(--card);border-radius:999px;padding:8px;display:flex;
  box-shadow:0 6px 28px rgba(42,33,27,.13);z-index:20}
nav button{flex:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);
  padding:10px 4px;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{background:var(--bg);color:var(--ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  width:min(430px,calc(100% - 36px));background:var(--ink);color:#FCFAF6;border-radius:999px;padding:12px 20px;
  display:none;align-items:center;justify-content:space-between;z-index:21;box-shadow:0 6px 28px rgba(42,33,27,.2)}
#timer.on{display:flex}
#timer b{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700}
#timer button{background:rgba(252,250,246,.18);color:#FCFAF6;border:0;border-radius:999px;
  padding:8px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
/* ── in-page modal (replaces blocked confirm/prompt) ── */
#modal{position:fixed;inset:0;background:rgba(42,33,27,.42);display:none;align-items:flex-end;
  justify-content:center;z-index:40;padding:18px}
#modal.on{display:flex}
#modal .sheet{background:var(--card);border-radius:26px;padding:22px;width:100%;max-width:430px;
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
#modal p{margin:0 0 16px;font-size:17px;font-weight:700}
#modal .mbtns{display:flex;gap:10px;margin-top:16px}
#modal .mbtns .btn{padding:15px;font-size:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--ink);color:#FCFAF6;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;
  z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<div id="timer"><b id="tval">01:30</b><span class="small">راحة</span><button onclick="stopTimer()">تخطّي</button></div>

<div id="modal"><div class="sheet">
  <p id="mtext"></p>
  <input id="minput" class="hide">
  <div class="mbtns">
    <button class="btn light" id="mno">إلغاء</button>
    <button class="btn" id="myes">تأكيد</button>
  </div>
</div></div>

<nav id="nav">
  <button data-tab="plan" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>الخطة</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>التقدم</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h4"/></svg>السجل</button>
</nav>

<script>
/* ══ program ══════════════════════════════════════════ */
const EQ={machine:"جهاز",dumbbell:"دمبل",barbell:"بار",cable:"كابل",body:"وزن الجسم"};
const PROGRAM={
 A:{label:"تمرين A",tag:"ضغط رجل + دفع وسحب أفقي",ex:[
  {id:"a1",n:"Leg Press / Hack Squat",eq:"machine",sets:3,lo:8,hi:10},
  {id:"a2",n:"Incline Dumbbell Press",eq:"dumbbell",sets:3,lo:8,hi:10},
  {id:"a3",n:"Chest-Supported Row",eq:"machine",sets:3,lo:10,hi:12},
  {id:"a4",n:"Dumbbell RDL",eq:"dumbbell",sets:3,lo:8,hi:10},
  {id:"a5",n:"Lateral Raises",eq:"dumbbell",sets:3,lo:12,hi:15},
  {id:"a6",n:"Hanging Knee Raises",eq:"body",sets:3,lo:10,hi:20}]},
 B:{label:"تمرين B",tag:"Pull-up أولوية + رجل أحادية",ex:[
  {id:"b1",n:"Pull-up",eq:"body",addw:true,sets:4,lo:5,hi:8},
  {id:"b2",n:"Bulgarian Split Squat",eq:"dumbbell",uni:true,sets:3,lo:8,hi:10},
  {id:"b3",n:"Seated DB Shoulder Press",eq:"dumbbell",sets:3,lo:8,hi:10},
  {id:"b4",n:"Lying Leg Curl",eq:"machine",sets:3,lo:10,hi:12},
  {id:"b5",n:"Incline Dumbbell Curl",eq:"dumbbell",sets:3,lo:10,hi:12},
  {id:"b6",n:"Hollow Body Hold",eq:"body",sec:true,sets:3,lo:20,hi:45}]},
 C:{label:"تمرين C",tag:"Dips أولوية + ضغط أفقي",ex:[
  {id:"c1",n:"Dips",eq:"body",addw:true,sets:4,lo:6,hi:10},
  {id:"c2",n:"Flat Barbell Bench Press",eq:"barbell",sets:3,lo:6,hi:8},
  {id:"c3",n:"Single-Arm Dumbbell Row",eq:"dumbbell",uni:true,sets:3,lo:8,hi:10},
  {id:"c4",n:"Leg Extension + Seated Curl",eq:"machine",sets:3,lo:10,hi:12},
  {id:"c5",n:"Face Pulls",eq:"cable",sets:3,lo:15,hi:20},
  {id:"c6",n:"Standing Calf Raises",eq:"machine",sets:4,lo:12,hi:15}]}};
const ORDER=["A","B","C"],GOAL=10,KEY="tamreen-v2";
const ALL=Object.values(PROGRAM).flatMap(p=>p.ex);
const byId=id=>ALL.find(x=>x.id===id);

/* ══ state ════════════════════════════════════════════ */
let D={cursor:"A",sessions:[],waist:[],units:{},sides:{},swaps:{},videos:{}};
let tab="plan",draft=null,tick=null,progEx="a1";

const SEED={date:"2026-08-23",workout:"A",entries:{
  a1:[{w:"60",r:"10"},{w:"80",r:"10"},{w:"100",r:"10"}],
  a2:[{w:"10",r:"12"},{w:"12",r:"10"},{w:"14",r:"10"}],
  a3:[{w:"25",r:"12"},{w:"35",r:"10"},{w:"45",r:"10"}],
  a4:[{w:"12",r:"10"},{w:"14",r:"10"},{w:"16",r:"10"}],
  a5:[{w:"5",r:"10"},{w:"7.5",r:"10"},{w:"10",r:"6"}],
  a6:[{w:"",r:"20"},{w:"",r:"10"},{w:"",r:"10"}]},units:{}};

try{
  const raw=localStorage.getItem(KEY);
  if(raw) D={...D,...JSON.parse(raw)};
  else{ D.sessions=[SEED]; D.cursor="B"; D.swaps={a3:"Chest Cable Row"}; }
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const buzz=ms=>{try{navigator.vibrate?.(ms)}catch(e){}};

const today=()=>new Date().toISOString().slice(0,10);
const ym=s=>s.slice(0,7);
const fdate=s=>new Date(s).toLocaleDateString("ar-EG",{day:"numeric",month:"short"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unitOf=id=>D.units[id]||"kg";
const perSide=id=>!!D.sides[id];
const nameOf=e=>D.swaps[e.id]||e.n;
const toKg=(v,u)=>(+v||0)*(u==="lb"?0.4536:1);
const monthCount=()=>D.sessions.filter(s=>ym(s.date)===ym(today())).length;
const clone=o=>JSON.parse(JSON.stringify(o));
const ytURL=e=>D.videos[e.id]||("https://www.youtube.com/results?search_query="+encodeURIComponent(e.n+" proper form technique"));

function volume(s){
  let t=0;
  for(const [id,rows] of Object.entries(s.entries||{})){
    const ex=byId(id); if(!ex) continue;
    const u=s.units?.[id]||"kg", mult=(ex.eq==="dumbbell"&&!ex.uni)?2:1;
    rows.forEach(r=>{ t+=toKg(r.w,u)*((+r.r||0)+(+r.r2||0))*mult; });
  }
  return t;
}
function lastFor(id){
  for(let i=D.sessions.length-1;i>=0;i--){
    const e=D.sessions[i].entries?.[id];
    if(e&&e.some(s=>s.r)) return {rows:e,u:D.sessions[i].units?.[id]||"kg"};
  }
  return null;
}
function bumpFlag(ex){
  const l=lastFor(ex.id); if(!l) return false;
  const done=l.rows.filter(s=>s.r);
  return done.length>=ex.sets && done.every(s=>Math.min(+s.r,+s.r2||+s.r)>=ex.hi);
}
/* best set of an exercise in a session → est 1RM (Epley), or max reps for bodyweight */
function bestSet(sess,ex){
  const rows=sess.entries?.[ex.id]||[], u=sess.units?.[ex.id]||"kg";
  let best=null;
  rows.forEach(r=>{
    const reps=Math.max(+r.r||0,+r.r2||0); if(!reps) return;
    const kg=toKg(r.w,u);
    const score=kg>0?kg*(1+reps/30):reps;
    if(!best||score>best.score) best={score,kg,reps,u};
  });
  return best;
}

/* ══ modal ════════════════════════════════════════════ */
function sheet({text,value,yes="تأكيد",danger,onYes}){
  const m=document.getElementById("modal"),inp=document.getElementById("minput");
  document.getElementById("mtext").textContent=text;
  inp.classList.toggle("hide",value===undefined);
  if(value!==undefined){ inp.value=value; inp.style.textAlign="right"; inp.style.fontFamily="inherit"; inp.style.fontSize="15px"; }
  const y=document.getElementById("myes"),n=document.getElementById("mno");
  y.textContent=yes; y.className="btn"+(danger?" danger":"");
  const close=()=>{m.classList.remove("on");y.onclick=null;n.onclick=null;m.onclick=null;};
  y.onclick=()=>{ buzz(18); const v=inp.value; close(); onYes(v); };
  n.onclick=close;
  m.onclick=e=>{ if(e.target===m) close(); };
  m.classList.add("on");
  if(value!==undefined) setTimeout(()=>inp.focus(),80);
}
let toastT=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1400);
}

/* ══ views ════════════════════════════════════════════ */
function vPlan(){
  const w=PROGRAM[D.cursor],c=monthCount();
  return `<div class="top">
    <div><h1>اللي جاي</h1><div class="sub">${w.label} — ${esc(w.tag)}</div></div>
    <div class="avatar">A</div></div>

  <div class="label">حصص الشهر</div>
  <div class="card">
    <div class="row" style="padding-top:0">
      <div><span class="num" style="font-size:30px;font-weight:700">${c}</span><span class="muted num"> / ${GOAL}</span></div>
      ${c>=GOAL?'<span class="chip on">هدف الشهر تم</span>':'<span class="muted small">الشهر هو المقياس، مش الأسبوع</span>'}
    </div>
    <div class="pills">${Array.from({length:GOAL},(_,i)=>`<div class="pill ${i<c?'on':''}"></div>`).join("")}</div>
  </div>

  <div class="label">تمارين النهارده</div>
  <div class="card">${w.ex.map((e,i)=>`<div class="row">
      <div><div style="font-weight:${i<3?700:500};color:${i<3?'var(--ink)':'var(--muted)'}">${esc(nameOf(e))}</div>
      <div class="small muted num">${EQ[e.eq]} · ${e.sets} × ${e.lo}–${e.hi}${e.sec?" sec":""}</div></div>
      ${i===2?'<span class="chip on">الحد الأدنى</span>':''}</div>`).join("")}</div>

  <div style="margin-top:22px"><button class="btn" onclick="start()">ابدأ الحصة</button></div>
  <div style="margin-top:10px"><button class="btn light" onclick="skip()">بدّل لتمرين تاني</button></div>`;
}

function setsHTML(e){
  const u=unitOf(e.id),side=perSide(e.id),last=draft.edit==null?lastFor(e.id):null,hideW=(e.eq==="body"&&!e.addw);
  return `<div class="hints"><span class="i"></span>
      ${hideW?"":`<span class="hint" style="flex:1">${e.addw?"وزن إضافي":"وزن"} (${u})</span>`}
      <span class="hint" style="flex:1">${e.sec?"ثواني":(side?"يمين":"عدّات")}</span>
      ${side?'<span class="hint" style="flex:1">شمال</span>':""}
      <span class="prev"></span></div>
    ${Array.from({length:e.sets},(_,s)=>{
      const p=last?.rows[s],cur=draft.entries[e.id][s]||{w:"",r:"",r2:""};
      return `<div class="set"><span class="i">S${s+1}</span>
        ${hideW?"":`<input inputmode="decimal" placeholder="—" value="${esc(cur.w)}" oninput="edit('${e.id}',${s},'w',this.value)">`}
        <input inputmode="numeric" placeholder="—" value="${esc(cur.r)}" oninput="edit('${e.id}',${s},'r',this.value)">
        ${side?`<input inputmode="numeric" placeholder="—" value="${esc(cur.r2)}" oninput="edit('${e.id}',${s},'r2',this.value)">`:""}
        <span class="prev">${p?`${p.w?p.w+" × ":""}${p.r||"—"}${p.r2?"/"+p.r2:""}`:(draft.edit==null?"أول مرة":"")}</span></div>`;
    }).join("")}`;
}

function vSession(){
  const p=PROGRAM[draft.workout],editing=draft.edit!=null;
  const card=(e,i)=>`<div class="ex" id="ex-${e.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div><h3>${esc(nameOf(e))}</h3>
          <div class="meta num">${e.sets} × ${e.lo}–${e.hi} ${e.sec?"SEC":"REPS"}</div></div>
        <div class="num" style="font-size:22px;color:var(--line);font-weight:700">${String(i+1).padStart(2,"0")}</div>
      </div>
      ${!editing&&bumpFlag(e)?'<div class="note">كمّلت الـ range المرة اللي فاتت — زوّد ٢.٥ كجم</div>':''}
      <div class="ctrls">
        <span class="chip tag">${EQ[e.eq]}</span>
        ${(e.eq==="body"&&!e.addw)?"":`<select onchange="setUnit('${e.id}',this.value)">
          <option value="kg" ${unitOf(e.id)==="kg"?"selected":""}>kg</option>
          <option value="lb" ${unitOf(e.id)==="lb"?"selected":""}>lb</option></select>`}
        <button class="chip ${perSide(e.id)?"on":""}" onclick="toggleSide('${e.id}')">يمين / شمال</button>
        <a class="chip ${D.videos[e.id]?"ink":""}" href="${esc(ytURL(e))}" target="_blank" rel="noopener">▶ شرح</a>
        <button class="chip" onclick="pinVideo('${e.id}')">${D.videos[e.id]?"غيّر اللينك":"ثبّت لينك"}</button>
        <button class="chip" onclick="swap('${e.id}')">بدّل التمرين</button>
      </div>
      <div class="sets" id="sets-${e.id}">${setsHTML(e)}</div>
      <div style="margin-top:12px"><button class="chip" onclick="startTimer(90)">راحة ٩٠ ثانية</button></div>
    </div>`;
  return `<div class="top">
    <div><h1>${p.label}</h1><div class="sub">${editing?"تعديل حصة "+fdate(draft.date):fdate(today())}</div></div>
    <button class="btn light" style="width:auto;padding:12px 20px;font-size:15px" onclick="cancel()">${editing?"رجوع":"إلغاء"}</button></div>
  <div style="margin-top:22px">${p.ex.slice(0,3).map(card).join("")}</div>
  ${editing?"":'<div class="divider"><hr><b>تقدر تنهي هنا — تتحسب حصة كاملة</b><hr></div>'}
  ${p.ex.slice(3).map((e,i)=>card(e,i+3)).join("")}
  <div style="margin-top:20px">
    <button class="btn" id="fin" onclick="finish()">${editing?"حفظ التعديلات":"إنهاء الحصة"}</button>
    <div class="small muted num" id="cnt" style="text-align:center;margin-top:10px"></div>
    ${editing?`<div style="margin-top:12px"><button class="btn danger" onclick="delSession()">حذف الحصة</button></div>`:""}</div>`;
}

function vProg(){
  const ex=byId(progEx);
  const hist=D.sessions.filter(s=>bestSet(s,ex)).map(s=>({date:s.date,b:bestSet(s,ex)}));
  const max=Math.max(1,...hist.map(h=>h.b.score));
  const peak=Math.max(...hist.map(h=>h.b.score),0);
  const w=D.waist,diff=w.length>1?(w[w.length-1].cm-w[0].cm):null;
  const lastN=D.sessions.slice(-8);
  return `<div class="top"><div><h1>التقدم</h1><div class="sub">الأرقام مش المرايا</div></div><div class="avatar">A</div></div>

  <div class="label">تمرين واحد عبر الوقت</div>
  <select class="big" onchange="setProg(this.value)">
    ${ORDER.map(k=>`<optgroup label="${PROGRAM[k].label}">${PROGRAM[k].ex.map(e=>
      `<option value="${e.id}" ${e.id===progEx?"selected":""}>${esc(nameOf(e))}</option>`).join("")}</optgroup>`).join("")}
  </select>
  <div class="card" style="margin-top:12px">
    ${hist.length?`<div class="bars">${hist.slice(-10).map(h=>
      `<div class="${h.b.score===peak?"best":""}" style="height:${Math.max(8,h.b.score/max*100)}%"></div>`).join("")}</div>
      <div style="margin-top:14px">${hist.slice(-4).reverse().map(h=>`<div class="row">
        <div class="num" style="font-weight:700">${h.b.kg>0?`${(+h.b.kg.toFixed(1))} kg × ${h.b.reps}`:`${h.b.reps} عدّة`}</div>
        <div class="small muted num">${fdate(h.date)}${h.b.kg>0?` · ≈${Math.round(h.b.score)} 1RM`:""}</div></div>`).join("")}</div>
      <div class="small muted" style="margin-top:12px">أعلى ست في كل حصة. لو الأعمدة بتطلع، انت بتكبر.</div>`
    :'<div class="muted small">التمرين ده لسه ماتسجلش. اعمله مرة وهيظهر هنا.</div>'}
  </div>

  <div class="label">محيط الوسط</div>
  <div class="card">
    <div style="display:flex;gap:10px">
      <input id="waist" inputmode="decimal" placeholder="بالسنتيمتر" style="text-align:right;font-family:inherit;font-size:15px">
      <button class="btn sage" style="width:auto;padding:12px 22px;font-size:15px" onclick="addWaist()">سجّل</button></div>
    ${w.length?`<div style="margin-top:8px">${w.map((x,i)=>`<div class="row tap" onclick="editWaist(${i})">
      <div class="num" style="font-weight:700;font-size:19px">${x.cm}<span class="small muted"> cm</span></div>
      <div class="small muted num">${fdate(x.date)} · تعديل</div></div>`).join("")}</div>
      ${diff!==null?`<div class="small" style="margin-top:12px;color:${diff<0?'var(--sage-ink)':'var(--muted)'}">
      ${diff<0?`نزلت ${Math.abs(diff).toFixed(1)} سم من أول قياس`:`فرق ${diff.toFixed(1)} سم عن أول قياس`}</div>`:""}`
    :'<div class="small muted" style="margin-top:12px">قيس كل ٤ أسابيع بس.</div>'}
  </div>

  <div class="label">إجمالي الحمل (مؤشر عام)</div>
  <div class="card">
    ${lastN.length?`<div class="bars" style="height:70px">${lastN.map(s=>
      `<div style="height:${Math.max(8,volume(s)/Math.max(1,...lastN.map(volume))*100)}%"></div>`).join("")}</div>
      <div class="small muted" style="margin-top:10px">قارن A بـ A و C بـ C بس — الأرقام دي تقريبية.</div>`
    :'<div class="muted small">لسه مفيش داتا.</div>'}
  </div>`;
}

function vLog(){
  return `<div class="top"><div><h1>السجل</h1><div class="sub">${D.sessions.length} حصة</div></div><div class="avatar">A</div></div>
  <div class="label">اضغط على أي حصة للتعديل أو الحذف</div>
  ${D.sessions.length?`<div class="card">${D.sessions.map((s,i)=>({s,i})).reverse().map(({s,i})=>`
    <div class="row tap" onclick="openSession(${i})">
      <div><div style="font-weight:700">${PROGRAM[s.workout].label}</div>
      <div class="small muted num">${Math.round(volume(s)).toLocaleString("en")} kg إجمالي</div></div>
      <div class="small muted num">${fdate(s.date)} ›</div></div>`).join("")}</div>`
   :'<div class="card muted small">مفيش حصص لسه.</div>'}
  <div style="margin-top:20px"><button class="btn light" onclick="exportCSV()">تصدير CSV</button></div>
  <div style="margin-top:10px"><button class="btn danger" onclick="wipe()">مسح كل البيانات</button></div>`;
}

/* ══ render ═══════════════════════════════════════════ */
function render(toTop=true){
  const y=window.scrollY;
  document.getElementById("app").innerHTML =
    draft?vSession():tab==="plan"?vPlan():tab==="prog"?vProg():vLog();
  document.getElementById("nav").classList.toggle("hide",!!draft);
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(draft) refresh();
  window.scrollTo(0,toTop?0:y);       // ← keeps your place while logging
}
function refresh(){
  const p=PROGRAM[draft.workout];
  const n=Object.values(draft.entries).filter(r=>r.some(x=>x.r)).length;
  const cnt=document.getElementById("cnt"),fin=document.getElementById("fin");
  if(cnt) cnt.textContent=`${n} / ${p.ex.length} تمارين مسجّلة`;
  if(fin&&draft.edit==null) fin.textContent=n?`إنهاء الحصة (${n})`:"إنهاء الحصة";
}

/* ══ actions ══════════════════════════════════════════ */
function edit(id,s,f,v){ draft.entries[id][s][f]=v; refresh(); }
function setUnit(id,u){ D.units[id]=u; save(); redrawSets(id); toast("الوحدة: "+u); }
function toggleSide(id){ D.sides[id]=!D.sides[id]; save(); render(false); }
function redrawSets(id){ const el=document.getElementById("sets-"+id); if(el) el.innerHTML=setsHTML(byId(id)); }
function setProg(id){ progEx=id; render(false); }

function swap(id){
  sheet({text:"اسم التمرين اللي عملته بدله (فاضي = رجوع للأصلي)",value:nameOf(byId(id)),yes:"حفظ",
    onYes:v=>{ v.trim()?D.swaps[id]=v.trim():delete D.swaps[id]; save(); render(false); toast("اتغيّر"); }});
}
function pinVideo(id){
  sheet({text:"الصق لينك يوتيوب للتمرين ده (فاضي = رجوع للبحث)",value:D.videos[id]||"",yes:"ثبّت",
    onYes:v=>{ v.trim()?D.videos[id]=v.trim():delete D.videos[id]; save(); render(false); toast("اتثبّت"); }});
}
function start(){
  const entries={};
  PROGRAM[D.cursor].ex.forEach(e=>{
    const l=lastFor(e.id);
    entries[e.id]=Array.from({length:e.sets},(_,i)=>({w:l?.rows[i]?.w||"",r:"",r2:""}));
  });
  draft={workout:D.cursor,entries,date:today(),edit:null}; render();
}
function openSession(i){
  const s=D.sessions[i];
  const entries={};
  PROGRAM[s.workout].ex.forEach(e=>{
    const rows=s.entries?.[e.id]||[];
    entries[e.id]=Array.from({length:e.sets},(_,k)=>({w:rows[k]?.w||"",r:rows[k]?.r||"",r2:rows[k]?.r2||""}));
  });
  draft={workout:s.workout,entries,date:s.date,edit:i}; render();
}
function skip(){ D.cursor=ORDER[(ORDER.indexOf(D.cursor)+1)%3]; save(); render(); toast("اتبدّل"); }
function cancel(){
  if(draft.edit!=null){ draft=null; tab="log"; render(); return; }
  sheet({text:"تلغي الحصة من غير حفظ؟",yes:"إلغاء الحصة",danger:true,
    onYes:()=>{ draft=null; stopTimer(); render(); }});
}
function finish(){
  const n=Object.values(draft.entries).filter(r=>r.some(x=>x.r)).length;
  if(!n){ toast("سجّل تمرين واحد على الأقل"); return; }
  const units={}; PROGRAM[draft.workout].ex.forEach(e=>units[e.id]=unitOf(e.id));
  const rec={date:draft.date,workout:draft.workout,entries:clone(draft.entries),units};
  if(draft.edit!=null){ D.sessions[draft.edit]=rec; draft=null; save(); tab="log"; render(); toast("اتحفظ ✓"); }
  else{
    D.sessions.push(rec);
    D.cursor=ORDER[(ORDER.indexOf(rec.workout)+1)%3];
    draft=null; stopTimer(); save(); tab="plan"; render(); toast("حصة اتسجّلت ✓");
  }
  buzz(30);
}
function delSession(){
  const i=draft.edit;
  sheet({text:"تحذف الحصة دي نهائيًا؟",yes:"حذف",danger:true,
    onYes:()=>{ D.sessions.splice(i,1); draft=null; save(); tab="log"; render(); toast("اتحذفت"); buzz(30); }});
}
function addWaist(){
  const el=document.getElementById("waist"),v=parseFloat(el.value);
  if(!v){ toast("اكتب رقم"); return; }
  D.waist.push({date:today(),cm:v}); save(); render(false); toast("اتسجّل ✓");
}
function editWaist(i){
  sheet({text:`قياس ${fdate(D.waist[i].date)} — عدّله أو سيبه فاضي للحذف`,value:String(D.waist[i].cm),yes:"حفظ",
    onYes:v=>{
      const n=parseFloat(v);
      if(!v.trim()||!n) D.waist.splice(i,1); else D.waist[i].cm=n;
      save(); render(false); toast(n?"اتعدّل":"اتحذف");
    }});
}
function exportCSV(){
  const rows=[["date","workout","exercise","set","weight","unit","reps","reps_left"]];
  D.sessions.forEach(s=>PROGRAM[s.workout].ex.forEach(e=>(s.entries[e.id]||[]).forEach((r,i)=>{
    if(r.r||r.w) rows.push([s.date,s.workout,nameOf(e),i+1,r.w||"",s.units?.[e.id]||"kg",r.r||"",r.r2||""]);
  })));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));
  a.download="tamreen.csv"; a.click(); URL.revokeObjectURL(a.href); toast("اتصدّر");
}
function wipe(){
  sheet({text:"هيتمسح كل السجل نهائيًا. متأكد؟",yes:"امسح الكل",danger:true,
    onYes:()=>{ D={cursor:"A",sessions:[],waist:[],units:{},sides:{},swaps:{},videos:{}};
      save(); render(); toast("اتمسح"); buzz(40); }});
}
/* rest timer */
function startTimer(sec){
  stopTimer(); let left=sec;
  const bar=document.getElementById("timer"),val=document.getElementById("tval");
  bar.classList.add("on");
  const paint=()=>val.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
  paint();
  tick=setInterval(()=>{ left--; paint(); if(left<=0){ stopTimer(); buzz(400); toast("الراحة خلصت"); } },1000);
}
function stopTimer(){ if(tick)clearInterval(tick); tick=null; document.getElementById("timer").classList.remove("on"); }

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; buzz(10); render();
});
render();
</script>
</body>
</html>
