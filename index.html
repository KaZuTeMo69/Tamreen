<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamreen</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tamreen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/tafkir-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=14">
<script src="js/i18n.js?v=14"></script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="restoreFile" accept=".json,.csv,application/json,text/csv" class="hide">

<div id="timer"><b id="tval">01:30</b><span class="small" data-l="rest">Rest</span><button onclick="stopTimer()" data-l="skip">Skip</button></div>

<div id="modal"><div class="sheet">
  <p id="mtext"></p>
  <div id="mbody"></div>
  <input id="minput" class="hide">
  <textarea id="marea" class="hide" readonly></textarea>
  <div id="mform" class="hide"></div>
  <div class="mbtns">
    <button class="btn light" id="mno">Cancel</button>
    <button class="btn" id="myes">Confirm</button>
  </div>
</div></div>

<nav id="nav">
  <button data-tab="plan" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg><span data-l="plan">Plan</span></button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span data-l="prog">Progress</span></button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h4"/></svg><span data-l="log">Log</span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-l="set">Settings</span></button>
</nav>

<script src="js/program.js?v=14"></script>
<script src="js/seed.js?v=14"></script>
<script src="js/store.js?v=14"></script>
<script src="js/maths.js?v=14"></script>
<script src="js/ui.js?v=14"></script>
<script src="js/views.js?v=14"></script>
<script src="js/charts.js?v=14"></script>
<script src="js/actions.js?v=14"></script>
<script src="js/backup.js?v=14"></script>
<script src="js/coach.js?v=14"></script>
<script src="js/main.js?v=14"></script>
</body>
</html>
