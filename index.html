<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>تمرين</title>
<meta name="theme-color" content="#F2EEE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تمرين">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232A211B'/%3E%3Cg fill='%23F2EEE7'%3E%3Crect x='30' y='78' width='120' height='24' rx='12'/%3E%3Crect x='18' y='62' width='24' height='56' rx='10'/%3E%3Crect x='138' y='62' width='24' height='56' rx='10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EEE7;--card:#FCFAF6;--ink:#2A211B;--muted:#8C8378;--line:#E7E1D7;
  --sage:#D8E6C7;--sage-ink:#4A6138;--clay:#F6E5D8;--clay-ink:#8A4A20;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal','DM Sans',system-ui,sans-serif;
  font-size:16px;line-height:1.5;padding:max(14px,env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
.num{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums}
h1{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:12px 0 0}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--sage);color:var(--sage-ink);
  display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.label{font-size:19px;font-weight:700;margin:26px 0 10px}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.row+.row{border-top:1px solid var(--line)}
.tap{cursor:pointer;transition:background .12s,transform .08s}
.tap:active{background:var(--bg);transform:scale(.995)}
.muted{color:var(--muted)}.small{font-size:13px}
button,a.chip,select,label.chip{transition:transform .08s ease,filter .12s ease,background .12s ease}
button:active,a.chip:active,label.chip:active{transform:scale(.96);filter:brightness(.93)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:18px;font-family:inherit;
  font-size:17px;font-weight:700;background:var(--ink);color:#FCFAF6;cursor:pointer}
.btn.light{background:var(--card);color:var(--ink)}
.btn.sage{background:var(--sage);color:var(--sage-ink)}
.btn.danger{background:var(--clay);color:var(--clay-ink)}
.btn:disabled{opacity:.35}
.chip{display:inline-block;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;
  background:var(--bg);color:var(--muted);border:0;font-family:inherit;cursor:pointer;text-decoration:none}
.chip.on{background:var(--sage);color:var(--sage-ink)}
.chip.ink{background:var(--ink);color:#FCFAF6}
.chip.tag{background:transparent;color:var(--muted);border:1px solid var(--line);cursor:default}
.chip.tag:active{transform:none;filter:none}
.chip.w{padding:6px 9px;font-size:11px}
.pills{display:flex;gap:5px;margin-top:12px}
.pill{flex:1;height:10px;border-radius:999px;background:var(--line);transition:background .3s,height .3s}
.pill.on{background:var(--ink);height:16px}
.ex{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ex h3{margin:0;font-size:17px;font-weight:700}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
select{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);
  background:#fff;border-radius:999px;padding:6px 10px;color:var(--ink)}
select.big{font-size:15px;padding:12px 16px;width:100%;border-radius:16px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:6px}
.set .i{width:18px;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;flex:none}
.set.warm input{background:var(--bg);opacity:.75}
input{font-family:'DM Sans',sans-serif;font-size:17px;text-align:center;width:100%;min-width:0;
  padding:12px 4px;border:1px solid var(--line);background:#fff;border-radius:14px;color:var(--ink)}
input:focus{outline:2px solid var(--sage);outline-offset:-2px}
.hint{font-size:11px;color:var(--muted);text-align:center;font-family:'DM Sans',sans-serif}
.hints{display:flex;gap:6px;margin-bottom:-2px}
.hints .i{width:18px;flex:none}
.prev{min-width:52px;text-align:left;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;flex:none}
.note{margin-top:12px;background:var(--clay);color:var(--clay-ink);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500}
.tip{margin-top:10px;background:var(--sage);color:var(--sage-ink);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.hist{margin-top:8px;font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif}
.rir{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.divider{display:flex;align-items:center;gap:10px;margin:22px 2px}
.divider hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.divider b{font-size:13px;color:var(--sage-ink);background:var(--sage);padding:6px 12px;border-radius:999px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--ink);border-radius:8px 8px 4px 4px;min-height:4px}
.bars div.best{background:var(--sage-ink)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(430px,calc(100% - 36px));background:var(--card);border-radius:999px;padding:8px;display:flex;
  box-shadow:0 6px 28px rgba(42,33,27,.13);z-index:20}
nav button{flex:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);
  padding:10px 4px;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{background:var(--bg);color:var(--ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  width:min(430px,calc(100% - 36px));background:var(--ink);color:#FCFAF6;border-radius:999px;padding:12px 20px;
  display:none;align-items:center;justify-content:space-between;z-index:21;box-shadow:0 6px 28px rgba(42,33,27,.2)}
#timer.on{display:flex}
#timer b{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700}
#timer button{background:rgba(252,250,246,.18);color:#FCFAF6;border:0;border-radius:999px;
  padding:8px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(42,33,27,.42);display:none;align-items:flex-end;
  justify-content:center;z-index:40;padding:18px}
#modal.on{display:flex}
#modal .sheet{background:var(--card);border-radius:26px;padding:22px;width:100%;max-width:430px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
#modal p{margin:0 0 4px;font-size:17px;font-weight:700}
#mbody{font-size:14px;color:var(--muted);white-space:pre-line;margin-top:8px}
#modal .mbtns{display:flex;gap:10px;margin-top:16px}
#modal .mbtns .btn{padding:15px;font-size:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--ink);color:#FCFAF6;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;
  z-index:45;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="restoreFile" accept=".json,.csv,application/json,text/csv" class="hide">

<div id="timer"><b id="tval">01:30</b><span class="small">راحة</span><button onclick="stopTimer()">تخطّي</button></div>

<div id="modal"><div class="sheet">
  <p id="mtext"></p>
  <div id="mbody"></div>
  <input id="minput" class="hide">
  <div class="mbtns">
    <button class="btn light" id="mno">إلغاء</button>
    <button class="btn" id="myes">تأكيد</button>
  </div>
</div></div>

<nav id="nav">
  <button data-tab="plan" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>الخطة</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>التقدم</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h4"/></svg>السجل</button>
</nav>

<script>
/* ══ program ══════════════════════════════════════════ */
const EQ={machine:"جهاز",dumbbell:"دمبل",barbell:"بار",cable:"كابل",body:"وزن الجسم"};
const PROGRAM={
 A:{label:"تمرين A",tag:"ضغط رجل + دفع وسحب أفقي",ex:[
  {id:"a1",n:"Leg Press / Hack Squat",eq:"machine",sets:3,lo:8,hi:10},
  {id:"a2",n:"Incline Dumbbell Press",eq:"dumbbell",sets:3,lo:8,hi:10},
  {id:"a3",n:"Chest-Supported Row",eq:"machine",sets:3,lo:10,hi:12},
  {id:"a4",n:"Dumbbell RDL",eq:"dumbbell",sets:3,lo:8,hi:10},
  {id:"a5",n:"Lateral Raises",eq:"dumbbell",sets:3,lo:12,hi:15},
  {id:"a6",n:"Hanging Knee Raises",eq:"body",sets:3,lo:10,hi:20}]},
 B:{label:"تمرين B",tag:"سحب رأسي أولوية + رجل أحادية",ex:[
  {id:"b1",n:"Pull-up (assisted)",eq:"body",addw:true,assist:true,sets:4,lo:5,hi:8},
  {id:"b7",n:"Lat Pulldown",eq:"machine",sets:3,lo:10,hi:12},
  {id:"b2",n:"Bulgarian Split Squat",eq:"dumbbell",uni:true,sets:3,lo:8,hi:10},
  {id:"b3",n:"Seated DB Shoulder Press",eq:"dumbbell",sets:3,lo:8,hi:10},
  {id:"b4",n:"Lying Leg Curl",eq:"machine",sets:3,lo:10,hi:12},
  {id:"b5",n:"Incline Dumbbell Curl",eq:"dumbbell",sets:3,lo:10,hi:12},
  {id:"b6",n:"Hollow Body Hold",eq:"body",sec:true,sets:3,lo:20,hi:45}]},
 C:{label:"تمرين C",tag:"Dips أولوية + ضغط أفقي",ex:[
  {id:"c1",n:"Dips",eq:"body",addw:true,sets:4,lo:6,hi:10},
  {id:"c2",n:"Flat Barbell Bench Press",eq:"barbell",sets:3,lo:6,hi:8},
  {id:"c3",n:"Single-Arm Dumbbell Row",eq:"dumbbell",uni:true,sets:3,lo:8,hi:10},
  {id:"c4",n:"Leg Extension",eq:"machine",sets:3,lo:10,hi:12},
  {id:"c4b",n:"Seated Leg Curl",eq:"machine",sets:3,lo:10,hi:12},
  {id:"c5",n:"Face Pulls",eq:"cable",sets:3,lo:15,hi:20},
  {id:"c6",n:"Standing Calf Raises",eq:"machine",sets:4,lo:12,hi:15}]}};
const ORDER=["A","B","C"],GOAL=10,KEY="tamreen-v2";
const ALL=Object.values(PROGRAM).flatMap(p=>p.ex);
const byId=id=>ALL.find(x=>x.id===id);
const PLATES=[20,15,10,5,2.5,1.25];

/* ══ state ════════════════════════════════════════════ */
let D={cursor:"A",sessions:[],waist:[],units:{},sides:{},swaps:{},videos:{},bar:20,migrated:0};
let tab="plan",draft=null,tick=null,progEx="a1";

/* his first three sessions, restored from the CSV export */
const S=(w,r,r2)=>({w:w===null?"":String(w),r:String(r),r2:r2===undefined?"":String(r2),warm:false});
const SEED_SESSIONS=[
 {date:"2026-08-23",workout:"A",entries:{
   a1:[S(60,10),S(80,10),S(100,10)], a2:[S(10,12),S(12,10),S(14,10)],
   a3:[S(25,12),S(35,10),S(45,10)], a4:[S(12,10),S(14,10),S(16,10)],
   a5:[S(5,10,10),S(7.5,10,10),S(10,6,5)], a6:[S(null,20),S(null,10),S(null,10)]},
  names:{a3:"Chest Cable Row"}},
 {date:"2026-08-24",workout:"B",entries:{
   b1:[S(null,2),S(null,2),S(null,0),S(null,0)],
   b2:[S(2.5,10,10),S(5,10,10),S(10,10,10)], b3:[S(8,10,10),S(12,10,10),S(14,10,10)],
   b4:[S(25,12),S(35,11),S(50,8)], b5:[S(7,12,12),S(9,11,11),S(12,7,7)],
   b6:[S(null,38),S(null,32),S(null,30)]}},
 {date:"2026-08-27",workout:"C",entries:{
   c1:[S(null,10),S(null,9),S(null,7),S(null,6)], c2:[S(20,8),S(30,7),S(40,5)],
   c3:[S(12,12,12),S(14,10,10),S(18,10,10)], c4b:[S(40,12),S(45,11),S(50,10)],
   c5:[S(12.5,12),S(15,15),S(20,12)], c6:[S(10,15),S(20,13),S(20,10),S(30,10)]},
  names:{c4b:"Seated Leg Curl",c6:"Seated Calf Raise"}}];

try{
  const raw=localStorage.getItem(KEY);
  if(raw) D={...D,...JSON.parse(raw)};
  else{
    D.sessions=SEED_SESSIONS.map(s=>{
      const units={},names={...(s.names||{})},counts={};
      Object.keys(s.entries).forEach(id=>{ units[id]="kg"; counts[id]=s.entries[id].length;
        if(!names[id]) names[id]=(ALL.find(x=>x.id===id)||{}).n||id; });
      return {date:s.date,workout:s.workout,entries:s.entries,units,names,counts,rir:{}};
    });
    D.cursor="A";
    D.swaps={a3:"Chest Cable Row",c6:"Seated Calf Raise"};
    D.sides={a5:true,b2:true,b3:true,b5:true,c3:true};
    D.migrated=2;
  }
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const buzz=ms=>{try{navigator.vibrate?.(ms)}catch(e){}};

const today=()=>new Date().toISOString().slice(0,10);
const ym=s=>s.slice(0,7);
const fdate=s=>new Date(s).toLocaleDateString("ar-EG",{day:"numeric",month:"short"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unitOf=id=>D.units[id]||"kg";
const perSide=id=>!!D.sides[id];
const nameOf=e=>D.swaps[e.id]||e.n;
const nameIn=(s,id)=>s.names?.[id]||(byId(id)?nameOf(byId(id)):id);
const toKg=(v,u)=>(+v||0)*(u==="lb"?0.4536:1);
const clone=o=>JSON.parse(JSON.stringify(o));
const step=ex=>ex.eq==="dumbbell"?2:(ex.eq==="cable"?2.5:5);
/* FIX: same-day sessions count once toward the monthly goal */
const monthCount=()=>new Set(D.sessions.filter(s=>ym(s.date)===ym(today())).map(s=>s.date)).size;
const setCount=(s,e)=>s.counts?.[e.id]||(s.entries?.[e.id]?.length)||e.sets;

/* one-time migration: split the old merged leg card + freeze historical names */
(function migrate(){
  if(D.migrated>=2) return;
  D.sessions.forEach(s=>{
    if(s.workout==="C"&&s.entries?.c4&&!s.entries.c4b){
      s.entries.c4b=s.entries.c4; delete s.entries.c4;
      if(s.units?.c4){ s.units.c4b=s.units.c4; delete s.units.c4; }
    }
    if(!s.names){
      s.names={};
      Object.keys(s.entries||{}).forEach(id=>{ s.names[id]=byId(id)?nameOf(byId(id)):id; });
      if(s.entries?.c4b&&s.workout==="C") s.names.c4b="Seated Leg Curl";
    }
  });
  D.migrated=2; save();
})();

/* ══ maths ════════════════════════════════════════════ */
const working=rows=>(rows||[]).filter(r=>r.r&&!r.warm);
function volume(s){
  let t=0;
  for(const [id,rows] of Object.entries(s.entries||{})){
    const ex=byId(id); if(!ex) continue;
    const u=s.units?.[id]||"kg", mult=(ex.eq==="dumbbell"&&!ex.uni)?2:1;
    working(rows).forEach(r=>{ t+=toKg(r.w,u)*((+r.r||0)+(+r.r2||0))*mult; });
  }
  return t;
}
function historyOf(id){          // newest last
  return D.sessions.filter(s=>working(s.entries?.[id]).length)
    .map(s=>({date:s.date,rows:working(s.entries[id]),u:s.units?.[id]||"kg",rir:s.rir?.[id]}));
}
function lastFor(id){ const h=historyOf(id); return h.length?h[h.length-1]:null; }
function topSet(h){
  return h.rows.reduce((b,r)=>{
    const kg=toKg(r.w,h.u), reps=Math.max(+r.r||0,+r.r2||0);
    const sc=kg>0?kg*(1+reps/30):reps;
    return (!b||sc>b.sc)?{sc,kg,reps,w:r.w}:b;
  },null);
}
/* FEATURE: next-session weight suggestion, driven by RIR */
function suggest(ex){
  const h=lastFor(ex.id); if(!h) return null;
  const scored=h.rows.filter(r=>Math.max(+r.r||0,+r.r2||0)>0);
  if(!scored.length) return null;
  const last=scored[scored.length-1];
  const reps=Math.max(+last.r||0,+last.r2||0), kg=toKg(last.w,h.u), rir=h.rir;
  const st=step(ex), fmt=v=>+(v.toFixed(2));
  if(!kg){ // bodyweight
    if(rir===undefined) return `آخر مرة ${reps} عدّة — استهدف ${reps+1}`;
    if(rir>=3) return `RIR ${rir} — ضيف وزن أو زوّد لـ ${reps+3} عدّات`;
    if(rir<=1) return `آخر مرة ${reps} عدّة و RIR ${rir} — استهدف ${reps+1}`;
    return `آخر مرة ${reps} عدّة — استهدف ${reps+2}`;
  }
  if(rir===undefined) return reps>=ex.hi?`آخر مرة ${fmt(kg)} × ${reps} — جرّب ${fmt(kg+st)}`
    :`آخر مرة ${fmt(kg)} × ${reps} — ثبّت الوزن واستهدف ${ex.hi}`;
  if(rir>=3) return `RIR ${rir} — الوزن خفيف، جرّب ${fmt(kg+st*2)}`;
  if(rir==2)  return `RIR 2 — جرّب ${fmt(kg+st)}`;
  if(reps<ex.lo&&rir===0) return `الوزن تقيل — انزل لـ ${fmt(Math.max(st,kg-st))}`;
  if(reps>=ex.hi) return `RIR ${rir} وكمّلت العدّات — جرّب ${fmt(kg+st)}`;
  return `ثبّت على ${fmt(kg)} واستهدف ${ex.hi} عدّات`;
}
function histLine(id){
  const h=historyOf(id).slice(-3).reverse();
  if(!h.length) return "";
  return "آخر ٣: "+h.map(x=>{const t=topSet(x);return t.kg?`${+t.kg.toFixed(1)}×${t.reps}`:`${t.reps}`;}).join(" · ");
}

/* ══ modal / toast ════════════════════════════════════ */
function sheet({text,body="",value,type="text",yes="تأكيد",danger,onYes}){
  const m=document.getElementById("modal"),inp=document.getElementById("minput");
  document.getElementById("mtext").textContent=text;
  document.getElementById("mbody").textContent=body;
  inp.classList.toggle("hide",value===undefined);
  if(value!==undefined){ inp.type=type; inp.value=value;
    inp.style.textAlign=type==="text"?"right":"center"; inp.style.fontFamily=type==="text"?"inherit":"'DM Sans'";
    inp.style.fontSize="15px"; }
  const y=document.getElementById("myes"),n=document.getElementById("mno");
  y.textContent=yes; y.className="btn"+(danger?" danger":"");
  const close=()=>{m.classList.remove("on");y.onclick=null;n.onclick=null;m.onclick=null;};
  y.onclick=()=>{ buzz(18); const v=inp.value; close(); onYes&&onYes(v); };
  n.onclick=close; m.onclick=e=>{ if(e.target===m) close(); };
  m.classList.add("on");
  if(value!==undefined) setTimeout(()=>inp.focus(),80);
}
let toastT=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1600);
}

function plateCalc(id){
  const u=unitOf(id);
  sheet({text:"حاسبة أوزان البار",body:`وزن البار الحالي ${D.bar} كجم. اكتب الوزن الكلي المطلوب.`,value:"",type:"number",yes:"احسب",
    onYes:v=>{

        body:(out.join("\n")||"لا شيء")+(side>0.01?`\n(باقي ${side} كجم مش مظبوط بالأوزان المتاحة)`:""),yes:"تمام"});

  const rir={}; Object.entries(draft.rir).forEach(([k,v])=>{ if(v!==undefined) rir[k]=v; });

  else{
    D.sessions.push(rec);

/* CSV → sessions (accepts exports from any version of the app) */
const ALIASES={"chest cable row":"a3","pull-up":"b1","pull up":"b1","pull-up (assisted)":"b1",
  "leg extension + seated curl":"c4b","seated calf raise":"c6","standing calf raises":"c6",
  "leg press / hack squat":"a1"};
function nameToId(name){
  const k=String(name||"").trim().toLowerCase();
  if(ALIASES[k]) return ALIASES[k];
  const hit=ALL.find(e=>e.n.toLowerCase()===k);
  if(hit) return hit.id;
  for(const [id,nm] of Object.entries(D.swaps||{})) if(String(nm).toLowerCase()===k) return id;
  return null;
}
function parseCSV(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  const head=lines.shift().split(",").map(h=>h.trim().toLowerCase());
  const col=n=>head.indexOf(n);
  const iD=col("date"),iW=col("workout"),iE=col("exercise"),iWarm=col("warmup"),
        iWt=col("weight"),iU=col("unit"),iR=col("reps"),iL=col("reps_left"),iRir=col("rir");
  const map=new Map(),skipped=[];
  lines.forEach(line=>{
    const c=line.split(",");
    const date=c[iD]?.trim(), wk=c[iW]?.trim(), nm=c[iE]?.trim();
    if(!date||!PROGRAM[wk]) return;
    const id=nameToId(nm); if(!id){ skipped.push(nm); return; }
    const key=date+"|"+wk;
    if(!map.has(key)) map.set(key,{date,workout:wk,entries:{},units:{},names:{},counts:{},rir:{}});
    const s=map.get(key);
    (s.entries[id]=s.entries[id]||[]).push({
      w:(c[iWt]||"").trim(), r:(c[iR]||"").trim(), r2:(iL>=0?(c[iL]||"").trim():""),
      warm:iWarm>=0&&/warm/i.test(c[iWarm]||"")});
    s.units[id]=(iU>=0&&(c[iU]||"").trim())||"kg";
    s.names[id]=nm;
    s.counts[id]=s.entries[id].length;
    if(iRir>=0&&(c[iRir]||"").trim()!=="") s.rir[id]=+c[iRir];
  });
  return {sessions:[...map.values()].sort((a,b)=>a.date<b.date?-1:1),skipped};
}
function restore(){ document.getElementById("restoreFile").click(); }
document.getElementById("restoreFile").addEventListener("change",e=>{
  const f=e.target.files?.[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const txt=String(rd.result||"").replace(/^\uFEFF/,"");
    const isCSV=/\.csv$/i.test(f.name)||/^date,workout,exercise/i.test(txt.trim());
    try{
      if(isCSV){
        const {sessions,skipped}=parseCSV(txt);
        if(!sessions.length) throw 0;
        sheet({text:"استرجاع من CSV؟",
          body:`الملف فيه ${sessions.length} حصة.`+(skipped.length?`\nتمارين مش متعرّف عليها (هتتجاهل): ${[...new Set(skipped)].join(", ")}`:"")+
               `\nده هيستبدل كل الحصص الحالية.`,
          yes:"استرجاع",danger:true,
          onYes:()=>{ D.sessions=sessions; D.migrated=2; save(); draft=null; tab="log"; render(); toast("اترجّعت ✓"); }});
      }else{
        const obj=JSON.parse(txt);
        if(!obj||!Array.isArray(obj.sessions)) throw 0;
        sheet({text:"استرجاع النسخة؟",body:`الملف فيه ${obj.sessions.length} حصة. ده هيستبدل كل الداتا الحالية.`,
          yes:"استرجاع",danger:true,
          onYes:()=>{ D={...D,...obj}; save(); draft=null; tab="log"; render(); toast("اترجّعت ✓"); }});
      }
    }catch(err){ toast("الملف مش صالح"); }
    e.target.value="";
  };
  rd.readAsText(f);
});
function exportCSV(){
  const rows=[["date","workout","exercise","set","warmup","weight","unit","reps","reps_left","rir"]];
  [...D.sessions].sort((a,b)=>a.date<b.date?-1:1).forEach(s=>
    Object.keys(s.entries||{}).forEach(id=>(s.entries[id]||[]).forEach((r,i)=>{
      if(r.r||r.w) rows.push([s.date,s.workout,nameIn(s,id),i+1,r.warm?"warmup":"",r.w||"",
        s.units?.[id]||"kg",r.r||"",r.r2||"",s.rir?.[id]??""]);
    })));
  dl("tamreen.csv","\uFEFF"+rows.map(r=>r.join(",")).join("\n"),"text/csv");
  toast("اتصدّر");
}
function wipe(){
  sheet({text:"هيتمسح كل السجل نهائيًا",body:"اعمل نسخة احتياطية الأول لو مش متأكد.",yes:"امسح الكل",danger:true,
    onYes:()=>{ D={cursor:"A",sessions:[],waist:[],units:{},sides:{},swaps:{},videos:{},bar:20,migrated:2};
      save(); render(); toast("اتمسح"); buzz(40); }});
}
/* FIX: timestamp-based timer — survives screen lock / backgrounding */
let endAt=0;
function paintTimer(){
  const left=Math.max(0,Math.round((endAt-Date.now())/1000));
  document.getElementById("tval").textContent=
    String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
  if(left<=0&&tick){ stopTimer(); buzz(400); toast("الراحة خلصت"); }
}
function startTimer(sec){
  stopTimer(); endAt=Date.now()+sec*1000;
  document.getElementById("timer").classList.add("on");
  paintTimer(); tick=setInterval(paintTimer,250);
}
function stopTimer(){ if(tick)clearInterval(tick); tick=null; document.getElementById("timer").classList.remove("on"); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&tick) paintTimer(); });

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; buzz(10); render();
});
render();
</script>
</body>
